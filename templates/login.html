<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход — Series Writer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:#0e0e0e; color:#eee; font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
           min-height:100vh; margin:0; display:flex; flex-direction:column;
           align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
    .brand { text-align:center; margin-bottom:32px; max-width:720px; }
    .brand .logo {
      font-size:72px; font-weight:900; letter-spacing:-3px; line-height:1;
      background:linear-gradient(135deg,#a855f7 0%,#ec4899 50%,#f59e0b 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; color:transparent;
      filter:drop-shadow(0 0 32px rgba(168,85,247,0.35));
      margin-bottom:14px;
    }
    .brand .slogan {
      font-size:16px; color:#a3a3a3; font-style:italic; line-height:1.45;
      max-width:560px; margin:0 auto;
    }
    @media (max-width:640px) { .brand .logo { font-size:48px; letter-spacing:-2px; } }
    .card { background:#181818; border:1px solid #2a2a2a; border-radius:12px; padding:32px;
            max-width:420px; width:90%; box-shadow:0 12px 48px rgba(0,0,0,0.4); }
    h1 { margin:0 0 8px; font-size:22px; }
    p.muted { color:#888; margin:0 0 24px; font-size:14px; line-height:1.5; }
    .btn-google { display:flex; align-items:center; justify-content:center; gap:10px;
                  background:#fff; color:#202124; border:none; border-radius:8px;
                  padding:12px 16px; font-size:15px; font-weight:500; cursor:pointer;
                  width:100%; text-decoration:none; transition:background .15s; }
    .btn-google:hover { background:#f1f3f4; }
    .btn-google svg { width:20px; height:20px; }
    .err { background:rgba(255,80,80,0.1); border:1px solid rgba(255,80,80,0.3);
           color:#ff8a8a; padding:10px 12px; border-radius:6px; margin-bottom:16px; font-size:13px; }
    .footer { margin-top:20px; text-align:center; font-size:12px; color:#666; }
    .promo-video-wrap {
      width: 100%; max-width: 720px;
      aspect-ratio: 16/9;
      border-radius: 14px; overflow: hidden;
      margin-bottom: 32px;
      box-shadow: 0 0 48px rgba(168,85,247,0.25), 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(168,85,247,0.3);
    }
    .promo-video-wrap iframe { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">MEGASLOP 9000</div>
    <div class="slogan" id="slogan">…</div>
  </div>
  <!-- Presentation video -->
  <div class="promo-video-wrap">
    <iframe
      src="https://www.youtube.com/embed/PROMO_VIDEO_ID?rel=0&modestbranding=1"
      title="MegaSlop 9000 — презентация"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <div class="card">
    <h1>Series Writer</h1>
    <p class="muted">Войди рабочей почтой <b>@{{ domain }}</b>, чтобы продолжить.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <a class="btn-google" href="/auth/google">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.4-.2-2.1H12v3.9h5.9c-.1.9-.7 2.4-2.1 3.4l-.02.13 3.06 2.37.21.02c1.95-1.8 3.07-4.45 3.07-7.69z"/>
        <path fill="#34A853" d="M12 23c2.78 0 5.12-.92 6.83-2.5l-3.25-2.52c-.87.6-2.04 1.02-3.58 1.02-2.73 0-5.05-1.8-5.88-4.29l-.12.01-3.18 2.46-.04.12C4.48 20.53 7.97 23 12 23z"/>
        <path fill="#FBBC05" d="M6.12 14.71c-.22-.65-.34-1.34-.34-2.06 0-.71.12-1.41.33-2.06l-.01-.14L2.93 7.95l-.1.05A11 11 0 001 12.65c0 1.77.42 3.45 1.17 4.93l3.95-2.87z"/>
        <path fill="#EA4335" d="M12 5.36c1.94 0 3.24.84 3.99 1.54l2.91-2.84C17.11 2.32 14.78 1.3 12 1.3c-4.03 0-7.52 2.47-9.17 6.05l3.94 2.87C7.6 7.16 9.92 5.36 12 5.36z"/>
      </svg>
      Войти через Google
    </a>
    <div class="footer">Доступ только для сотрудников GameGears</div>
  </div>
  <audio id="auth-meme-sound" src="/static/sounds/wait-a-minute.mp3" preload="auto"></audio>
  <script>
    // Random slogan on each page load. Curated collection of slop-themed
    // self-aware corporate-speak. Picked deterministically per pageload so
    // user gets variety. Add more — they're all roughly the same vibe.
    const SLOGANS = [
      'Производство шортсов промышленного масштаба. ИИ не спит.',
      'Один драматургический кризис в минуту, гарантировано.',
      'Качество слопа — наш приоритет №9000.',
      'Тут где-то Клара плачет в крыжовник.',
      'Бесконечный сценарный конвейер для бесконечной ленты.',
      'Если он не плачет — он не мужчина. Если она не плачет — серия не закончилась.',
      'Принимаем сценарии, отдаём сериалы. Промышленный шортс-завод.',
      'Каждый герой получит флешку с компроматом. Каждой Кларе — близнеца.',
      'AI-сценарист не устаёт. AI-сценарист не моргает. AI-сценарист пишет.',
      'Драмы, которые невозможно поставить на паузу — потому что они уже Seedance.',
      'У нас сегодня скидка на cliffhangers — два по цене одного.',
      'Контент-фабрика 24/7. Кофе не нужен — есть Claude.',
      'От синопсиса до видео за пару кликов и пару чеков от AVAI.',
      'Где-то здесь крадут сумочку. И это плот-релевантно.',
    ];
    document.getElementById('slogan').textContent =
      SLOGANS[Math.floor(Math.random() * SLOGANS.length)];

    // "Wait a minute, who are you?" meme on login page.
    // Many browsers block autoplay until user-gesture — first click anywhere
    // triggers the play. If autoplay IS allowed (rare on desktop, common on
    // muted page) it fires instantly.
    (function () {
      const el = document.getElementById('auth-meme-sound');
      if (!el) return;
      el.volume = 0.7;
      el.play().catch(() => {
        // Autoplay blocked — wait for first user interaction
        const onFirstInteract = () => {
          el.play().catch(() => {});
          window.removeEventListener('click', onFirstInteract, true);
          window.removeEventListener('keydown', onFirstInteract, true);
        };
        window.addEventListener('click', onFirstInteract, true);
        window.addEventListener('keydown', onFirstInteract, true);
      });
    })();
  </script>
</body>
</html>
